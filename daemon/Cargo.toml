[package]
name = "aurora-daemon"
version = "0.1.0"
edition = "2024"

authors = ["Joseph Chacko <josephchacko2006@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "musicmanV3 daemon, mpd clone."
readme = "../README.md"
homepage = "https://github.com/mavenried"
repository = "https://github.com/mavenried/musicmanV3"
keywords = ["cli", "music"]
categories = ["command-line-utilities"]

[dependencies]
lofty = { version = "0.25.4" }
anyhow = "1.0.104"
dirs = "7.0.0"
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v5", "serde"] }
walkdir = "2.5.0"
tokio = { version = "1.54.1", features = ["full"] }
daemonize = "0.5.0"
signal-hook = "0.4.5"
base64 = "0.23.1"

aurora-protocol = {path = "../protocol"}
mpris-server = "0.10.0"
notify = "8.2.0"
toml = "1.1.8"
futures = "0.3.34"
image = "0.25.10"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
