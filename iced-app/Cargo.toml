[package]
name = "aurora-player-iced"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aurora-player-iced"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
iced = { version = "0.14", features = ["tokio", "image"] }
tokio = { version = "1.54.1", features = ["full"] }

aurora-protocol = { path = "../protocol" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = "1.0.229"
serde_json = "1.0.154"
image = "0.25"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
