[package]
name = "aurora-player-iced"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aurora-player-iced"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
iced = { version = "0.14", features = ["tokio", "image"] }
tokio = { version = "1.48.0", features = ["full"] }

aurora-protocol = { path = "../protocol" }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
serde = "1.0.228"
serde_json = "1.0.145"
image = "0.25"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
